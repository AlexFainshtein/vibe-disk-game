<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe Disk Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">Click the disk to stop it, drag, then release to fling.</div>

  <div id="panel">
    <h4>Controls</h4>
    <label class="row">Disk size: <span id="diskRadiusVal">36</span></label>
    <input id="diskRadius" type="range" min="10" max="120" step="1" value="36">

    <label class="row">Friction: <span id="frictionVal">0.98</span></label>
    <input id="friction" type="range" min="0.900" max="0.999" step="0.001" value="0.98">

    <div class="row" style="margin-top:8px;">
      <button id="resetDefaults">Reset defaults</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
