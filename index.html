<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe Disk Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">Click the disk to stop it, drag, then release to fling.</div>

  <div id="panel">
    <h4>Controls</h4>
    <label class="row">Disk size: <span id="diskRadiusVal">60</span></label>
    <input id="diskRadius" type="range" min="10" max="120" step="1" value="60">

    <label class="row">Friction: <span id="frictionVal">0.020</span></label>
    <input id="friction" type="range" min="0" max="1" step="0.001" value="0.02">

    <label class="row">Bounce: <span id="bounceVal">0.90</span></label>
    <input id="bounce" type="range" min="0" max="1" step="0.01" value="0.9">

    <div class="row" style="margin-top:8px;">
      <button id="resetDefaults">Reset defaults</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
