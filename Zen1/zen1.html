<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe Disk Game — Zen1</title>
  <script>if(!sessionStorage.getItem('fromMenu'))location.replace('../index.html');else sessionStorage.removeItem('fromMenu');</script>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-player="zen1">
  <canvas id="game"></canvas>
  <div id="ui">Wiggle the disk.</div>
  <div id="panel">
    <button id="resetDisk">Reset</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="reverseBtn">↺ Reverse</button>
  </div>
  <div id="speed-panel">
    <button id="speedDown">−</button>
    <button id="speedUp">+</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/planck@1.0.0/dist/planck.min.js"></script>
  <script type="module" src="main-zen1.js"></script>
</body>
</html>
